<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BeterEnter</title>
<link rel="stylesheet" href="popup.css">
<main>
  <header><picture><source srcset="wordmark-dark.svg" media="(prefers-color-scheme: dark)"><img src="wordmark.svg" width="250" height="70" alt="Better↩"></picture><small>BeterEnter for ChatGPT</small></header>
  <label><input id="enabled" type="checkbox" disabled> キー変更を有効にする</label>
  <dl><dt>Enter / Shift+Enter</dt><dd>改行</dd><dt>Ctrl+Enter</dt><dd>送信</dd></dl>
  <p>IME変換中のEnterは変換確定に使えます。確定後、Ctrl+Enterで送信します。メッセージ入力欄だけで動作します。</p>
  <p id="status" role="status" aria-live="polite"></p>
</main>
<script src="popup.js"></script>
</html>
